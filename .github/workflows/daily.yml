name: Daily US Stock Dashboard Regenerate
# 北京时间 06:30 = UTC 22:30（前一天）。GitHub Actions 的 cron 使用 UTC。
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发测试

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # —— 读取真实凭证（未配置时优雅降级：热度榜空 + 长文占位，管线不中断）——
      # 默认走 OpenRouter（deepseek/deepseek-chat）。只需在仓库 Secrets 配置 LLM_API_KEY
      # （即 OpenRouter 的 sk-or-v1-... 密钥）；如需换模型/网关，再设 LLM_BASE_URL / LLM_MODEL。
      - name: Regenerate baselines + hot list + editorial
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek/deepseek-chat' }}
          FUTU_HOT_JSON: futu_hot.json
        run: node scripts/regenerate.mjs --write-html

      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 每日重生成 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      # —— 自动部署到 Cloudflare Pages（需仓库 Secrets: CLOUDFLARE_API_TOKEN）——
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c926e05f2df0b00dd6bb32c06000df66
          command: pages deploy . --project-name us-stock-dashboard --skip-caching
        continue-on-error: true # 部署失败不阻断主流程（可改回 false 以强制）
