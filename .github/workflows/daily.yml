name: Daily US Stock Dashboard Regenerate
# 北京时间 06:30 = UTC 22:30（前一天）。GitHub Actions 的 cron 使用 UTC。
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      stocks:
        description: '额外生成解读的股票代码（空格/逗号分隔，如 META）。留空=按线上自选股列表全量重生成（推荐）。'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # —— 预取线上自选股列表（服务端 KV 是唯一真相源）——
      # 若不读它，用户在网页上新加的股票永远等不到解读，已有解读也会一直冻结。
      # curl 带重试；失败时 regenerate.mjs 会自行再拉一次，仍失败则保留现有解读、安全降级。
      - name: Resolve current watchlist
        run: |
          CODES=$(curl -fsS --retry 3 --retry-delay 5 --max-time 20 \
            "https://us-stock-dashboard-bxj.pages.dev/api/watchlist" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.codes||[]).join(" "))}catch(e){}})' || true)
          if [ -n "$CODES" ]; then
            echo "WATCHLIST_CODES=$CODES" >> "$GITHUB_ENV"
            echo "本次自选股：$CODES"
          else
            echo "::warning::未能读取线上自选股列表；脚本将自行重试，若仍失败则保留现有解读、不做全量刷新。"
          fi

      # —— 读取真实凭证（未配置时优雅降级：热度榜空 + 长文占位，管线不中断）——
      # 默认走 OpenRouter（deepseek/deepseek-chat）。只需在仓库 Secrets 配置 LLM_API_KEY
      # （即 OpenRouter 的 sk-or-v1-... 密钥）；如需换模型/网关，再设 LLM_BASE_URL / LLM_MODEL。
      # 每次运行都会为 WATCHLIST_CODES 中的全部股票重生成解读并合并注入 stockNotes；
      # workflow_dispatch 的 stocks 输入用于额外指定不在自选列表里的股票（方案A）。
      - name: Regenerate baselines + hot list + editorial
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek/deepseek-chat' }}
          FUTU_HOT_JSON: futu_hot.json
          # 用户输入经环境变量传递，不直接嵌入脚本，避免特殊字符注入；cron 触发时为空串
          STOCKS_INPUT: ${{ inputs.stocks }}
        run: |
          SYMS="${STOCKS_INPUT//,/ }"
          node scripts/regenerate.mjs $SYMS --write-html
          # index.html 为部署入口，与源文件 us-stock-dashboard.html 保持同步
          cp us-stock-dashboard.html index.html

      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 每日重生成 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      # —— 自动部署到 Cloudflare Pages（需仓库 Secrets: CLOUDFLARE_API_TOKEN）——
      # 先探测凭证：未配置时明确跳过并给出提示，避免"假成功"（wrangler 会在 CI 非交互
      # 环境因缺 CLOUDFLARE_API_TOKEN 直接报错，若用 continue-on-error 会被掩盖）。
      - name: Check deploy credentials
        id: cfcheck
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN：长文已生成并提交，但跳过自动部署。线上站点需手动 wrangler pages deploy，或在 Cloudflare 把 Pages 项目改为 Git 集成（push 即部署）。"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cfcheck.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c926e05f2df0b00dd6bb32c06000df66
          command: pages deploy . --project-name us-stock-dashboard --skip-caching --branch main

      # —— 部署后回读生产域名，确认线上确实拿到本次内容（防止"假成功"）——
      - name: Verify live deployment
        if: steps.cfcheck.outputs.ready == 'true'
        run: node scripts/verify-live.mjs
